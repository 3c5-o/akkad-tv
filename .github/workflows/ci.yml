name: AKKAD CI
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          node --check server.mjs
          node --check public/akkad.js
          node --check public/control.js
          node --check admin-extras.mjs
          node --check viewer-service.mjs
          node --check auto-import.mjs
          node --check source-manager.mjs
          node --check cloudflare/worker.js
      - name: API smoke tests
        run: npm test
